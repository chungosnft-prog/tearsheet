<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tearsheet</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true"></span><b>Tearsheet</b><small>filter gallery</small></div>
  <div class="tools">
    <button id="openBtn" title="Open image (or drop / paste one)">Open…</button>
    <input type="file" id="file" accept="image/*" hidden>
    <button id="sampleBtn" title="Load the built-in sample">Sample</button>
    <label class="field" title="Working resolution — every effect renders at this size">
      <span>Size</span>
      <select id="docSize">
        <option value="1000">1000 px</option>
        <option value="1600">1600 px</option>
        <option value="2000">2000 px</option>
        <option value="2400">2400 px</option>
        <option value="3200">3200 px</option>
        <option value="4000">4000 px</option>
        <option value="native">Original</option>
      </select>
    </label>
    <select id="recipeSel" title="Load a ready-made stack"><option value="">Recipes…</option></select>
    <span class="sep"></span>
    <button id="undoBtn" class="icon" title="Undo (⌘Z)">↶</button>
    <button id="redoBtn" class="icon" title="Redo (⇧⌘Z)">↷</button>
    <span class="sep"></span>
    <div class="seg" id="compare" title="Hold \ to peek at the original">
      <button data-v="after" class="on">After</button><button data-v="split">Split</button><button data-v="before">Before</button>
    </div>
  </div>
  <div class="right">
    <button id="zoomBtn" class="ghost" title="Click: fit · ⌘1: 100%">100%</button>
    <button id="exportJpg" title="Export JPG (flattened on white)">JPG</button>
    <button id="exportPng" class="primary" title="Export PNG with transparency">Export PNG</button>
  </div>
</header>

<main>
  <section id="viewport">
    <div id="stage"><canvas id="gl"></canvas></div>
    <div id="splitLine"><span></span></div>
    <div id="dropHint">Drop an image anywhere</div>
    <div class="hud" id="hud"></div>
  </section>

  <section id="gallery">
    <div class="gal-head">
      <input id="search" type="search" placeholder="Search filters…" autocomplete="off">
      <nav id="cats"></nav>
    </div>
    <div id="thumbs"></div>
    <p class="gal-tip">Click to swap the selected layer’s filter · <kbd>⇧</kbd>-click or <b>+</b> to stack a new layer</p>
  </section>

  <aside id="inspector">
    <div id="params"></div>
    <div id="layers">
      <div class="layers-head">
        <span>Effect layers</span>
        <div>
          <button id="dupLayer" class="icon" title="Duplicate layer">⧉</button>
          <button id="delLayer" class="icon" title="Delete layer">✕</button>
        </div>
      </div>
      <ul id="layerList"></ul>
    </div>
  </aside>
</main>
<div id="toast"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
